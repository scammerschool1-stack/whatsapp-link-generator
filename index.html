<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Link Generator</title>
<style>
body{
font-family: Arial;
text-align:center;
margin-top:100px;
}

input{
padding:10px;
width:250px;
}

button{
padding:10px 20px;
margin-top:10px;
}

a{
display:block;
margin-top:20px;
font-size:18px;
}
</style>
</head>

<body>

<h2>WhatsApp Link Generator</h2>

<input type="text" id="number" placeholder="Enter number with country code">

<br>

<button onclick="generate()">Generate Link</button>

<a id="result" target="_blank"></a>

<script>
function generate(){

let number=document.getElementById("number").value;

let message="From Ðarlingtøn Save As";

let encoded=encodeURIComponent(message);

let link="https://wa.me/"+number+"?text="+encoded;

document.getElementById("result").href=link;

document.getElementById("result").innerHTML=link;

}
</script>

</body>
</html>
