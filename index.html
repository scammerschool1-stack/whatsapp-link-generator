<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Link Generator</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 100px;
}
input {
  padding: 10px;
  width: 260px;
  font-size: 16px;
}
button {
  padding: 10px 20px;
  font-size: 16px;
  margin-top: 10px;
  cursor: pointer;
}
#result {
  margin-top: 20px;
  font-size: 16px;
  word-break: break-word;
  text-align: left;
  display: inline-block;
}
</style>
</head>
<body>

<h2>WhatsApp Link Generator</h2>
<p>Enter business phone number with country code:</p>
<input id="number" placeholder="2348012345678">
<br><br>
<button onclick="generate()">Generate Link</button>

<div id="result"></div>

<script>
function generate() {
  let number = document.getElementById("number").value.trim();

  if (!number) {
    alert("Please enter a phone number!");
    return;
  }

  // Message to appear when someone taps the WhatsApp link
  let message = "From Ðarlingtøn\nSave As";
  let encoded = encodeURIComponent(message);

  // Generate the WhatsApp link
  let link = "https://wa.me/" + number + "?text=" + encoded;

  // Show the link as text only (not clickable)
  document.getElementById("result").innerHTML = 
      "<p>Links = </p>" + 
      "<p>" + link + "</p>";
}
</script>

</body>
</html>
