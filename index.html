<!DOCTYPE html>
<html>
<head>
<title>WhatsApp Business Link Generator</title>

<style>
body{
font-family: Arial;
text-align:center;
margin-top:100px;
}

input{
padding:10px;
width:260px;
font-size:16px;
}

button{
padding:10px 20px;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:18px;
word-break: break-all;
}

</style>
</head>

<body>

<h2>WhatsApp Business Link Generator</h2>

<p>Enter business phone number</p>

<input id="number" placeholder="2348012345678">

<br><br>

<button onclick="generate()">Generate WhatsApp Link</button>

<div id="result"></div>

<script>
function generate(){
    let number = document.getElementById("number").value.trim();

    if(!number){
        alert("Please enter a phone number!");
        return;
    }

    let message = "From Ðarlingtøn\nSave As";
    let encoded = encodeURIComponent(message);

    let link = "https://wa.me/" + number + "?text=" + encoded;

    // Instead of linking immediately, show the link as text
    document.getElementById("result").innerHTML =
        '<p>Copy this link and share it:</p>' +
        '<input type="text" value="'+link+'" id="copyLink" readonly style="width:80%;padding:8px;">' +
        '<br><br><button onclick="copyLink()">Copy Link</button>';
}

function copyLink(){
    let copyText = document.getElementById("copyLink");
    copyText.select();
    copyText.setSelectionRange(0, 99999); // For mobile devices
    document.execCommand("copy");
    alert("Link copied to clipboard!");
}
</script>

</body>
</html>
